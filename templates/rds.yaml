AWSTemplateFormatVersion: '2010-09-09'
Description: >
  camedina-infra RDS stack: Postgres for clients-service, credentials in
  Secrets Manager. The DB security group starts with no ingress rules -
  service-clients-service.yaml adds a SecurityGroupIngress rule scoped to
  its own ECS task security group to avoid a circular stack dependency.

Parameters:
  Environment:
    Type: String
    Default: dev
  DbInstanceClass:
    Type: String
    Default: db.t3.micro
  DbAllocatedStorage:
    Type: Number
    Default: 20
  DbEngineVersion:
    Type: String
    Default: '16.4'
  DbName:
    Type: String
    Default: clients
  DbMultiAz:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  DbBackupRetentionDays:
    Type: Number
    Default: 1

Resources:
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub camedina-${Environment} DB subnet group
      SubnetIds:
        - !ImportValue
          Fn::Sub: ${Environment}-private-subnet-1-id
        - !ImportValue
          Fn::Sub: ${Environment}-private-subnet-2-id

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub camedina-${Environment} RDS security group
      VpcId: !ImportValue
        Fn::Sub: ${Environment}-vpc-id
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub camedina-${Environment}-rds-sg

  DbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub camedina-${Environment}-clients-service-db
      Description: !Sub camedina-${Environment} clients-service RDS master credentials
      GenerateSecretString:
        SecretStringTemplate: '{"username": "clientsadmin"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"@/\'

  DbInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      EngineVersion: !Ref DbEngineVersion
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: !Ref DbAllocatedStorage
      StorageType: gp3
      DBName: !Ref DbName
      MasterUsername: !Sub '{{resolve:secretsmanager:${DbSecret}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DbSecret}:SecretString:password}}'
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups:
        - !Ref DbSecurityGroup
      MultiAZ: !Ref DbMultiAz
      BackupRetentionPeriod: !Ref DbBackupRetentionDays
      PubliclyAccessible: false
      StorageEncrypted: true

  DbSecretTargetAttachment:
    Type: AWS::SecretsManager::SecretTargetAttachment
    Properties:
      SecretId: !Ref DbSecret
      TargetId: !Ref DbInstance
      TargetType: AWS::RDS::DBInstance

Outputs:
  DbEndpointAddress:
    Value: !GetAtt DbInstance.Endpoint.Address
    Export:
      Name: !Sub ${Environment}-clients-service-db-endpoint
  DbEndpointPort:
    Value: !GetAtt DbInstance.Endpoint.Port
    Export:
      Name: !Sub ${Environment}-clients-service-db-port
  DbSecurityGroupId:
    Value: !Ref DbSecurityGroup
    Export:
      Name: !Sub ${Environment}-clients-service-db-sg-id
  DbSecretArn:
    Value: !Ref DbSecret
    Export:
      Name: !Sub ${Environment}-clients-service-db-secret-arn
